<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动话题剪辑</title><style>
:root{font-family:system-ui,sans-serif;color:#e9f4ec;background:#101916}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#17241e;border-bottom:1px solid #345243}h1{margin:0;font-size:25px}header p{margin:5px 0;color:#a9c1af}main{padding:24px 30px;max-width:1300px;margin:auto}.card{background:#1b2a22;border:1px solid #345243;border-radius:15px;padding:20px;margin-bottom:18px}h2{font-size:18px;margin:0 0 15px}.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}label{font-size:13px;color:#b8d1bf}input,textarea{background:#102018;color:#eef6ef;border:1px solid #45614c;border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:56px;resize:vertical}button{border:0;border-radius:8px;background:#72d49a;color:#102319;padding:10px 16px;font-weight:700;cursor:pointer}button.secondary{background:#34483a;color:#ecf4ec}button.danger{background:#583435;color:#fff}button:disabled{opacity:.5;cursor:wait}.pathrow{display:flex;gap:8px}.pathrow input{flex:1}.pathrow button{white-space:nowrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.topic{border:1px solid #405c46;border-radius:12px;padding:15px;margin:12px 0;background:#203128}.topic-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.topic-head h3{margin:0;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segment{display:grid;grid-template-columns:2fr .8fr .8fr auto;gap:8px;align-items:end;margin:9px 0}.hint{color:#aac3af;font-size:13px}.footer{display:flex;gap:12px;align-items:center}#status{color:#a6dcb5}pre{white-space:pre-wrap;background:#0d1711;padding:12px;border-radius:8px;max-height:180px;overflow:auto;color:#9cc6a6}@media(max-width:850px){.paths,.grid{grid-template-columns:1fr}.segment{grid-template-columns:1fr 1fr}.segment .source{grid-column:1/-1}}
</style></head><body><header><h1>自动话题剪辑</h1><p>把有效片段按话题排好，导出竖屏 1080p · 60 帧成片</p></header><main>
<section class="card"><h2>1. 选择目录</h2><div class="paths"><div class="field"><label>素材目录</label><div class="pathrow"><input id="sources" placeholder="原视频所在文件夹"><button data-choose="sources">选择</button></div></div><div class="field"><label>成品目录</label><div class="pathrow"><input id="output" placeholder="剪辑结果保存位置"><button data-choose="output">选择</button></div></div><div class="field"><label>剪辑计划 JSON</label><div class="pathrow"><input id="planfile" placeholder="可载入或保存计划"><button data-choose="planfile">打开</button></div></div></div></section>
<section class="card"><h2>2. AI 理解素材</h2><div class="paths"><div class="field"><label>OpenAI API Key（只在本次分析时使用）</label><input id="apikey" type="password" autocomplete="off" placeholder="sk-..."></div><div class="field"><label>内容分析模型</label><input id="model" value="gpt-4.1-mini"></div></div><p class="hint">AI 先转写视频原声，再生成话题、标题、前三秒钩子和剪辑切点。视频语义分析会使用云端 API；本版尚不识别纯画面空镜。分析会产生 API 费用。</p><button id="analyze">分析素材并生成计划</button></section>
<section class="card"><h2>3. 检查与调整计划</h2><div class="toolbar"><button id="addtopic">添加话题</button><button id="load" class="secondary">载入计划</button><button id="save" class="secondary">保存计划</button></div><div id="topics"></div><p class="hint">同一话题内从上到下依次播放。第一行是开头钩子；请检查专有名词、切点和结尾是否完整。</p></section>
<section class="card"><h2>4. 导出</h2><div class="footer"><button id="render">开始剪辑</button><span id="status">准备就绪</span></div><pre id="log" hidden></pre></section></main><script src="renderer.js"></script></body></html>
