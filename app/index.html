<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动话题剪辑</title><style>
:root{font-family:system-ui,sans-serif;color:#e9f4ec;background:#101916}*{box-sizing:border-box}body{margin:0}header{padding:22px 30px;background:#17241e;border-bottom:1px solid #345243}h1{margin:0;font-size:25px}header p{margin:5px 0;color:#a9c1af}main{padding:24px 30px;max-width:1300px;margin:auto}.card{background:#1b2a22;border:1px solid #345243;border-radius:15px;padding:20px;margin-bottom:18px}h2{font-size:18px;margin:0 0 15px}.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}label{font-size:13px;color:#b8d1bf}input,textarea,select{background:#102018;color:#eef6ef;border:1px solid #45614c;border-radius:8px;padding:10px;font:inherit;width:100%}textarea{min-height:56px;resize:vertical}button{border:0;border-radius:8px;background:#72d49a;color:#102319;padding:10px 16px;font-weight:700;cursor:pointer}button.secondary{background:#34483a;color:#ecf4ec}button.danger{background:#583435;color:#fff}button:disabled{opacity:.5;cursor:wait}.pathrow{display:flex;gap:8px}.pathrow input{flex:1}.pathrow button{white-space:nowrap}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.topic{border:1px solid #405c46;border-radius:12px;padding:15px;margin:12px 0;background:#203128}.topic-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.topic-head h3{margin:0;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.segment{display:grid;grid-template-columns:2fr .7fr .7fr 1fr auto;gap:8px;align-items:end;margin:9px 0}.hint{color:#aac3af;font-size:13px}.footer{display:flex;gap:12px;align-items:center}#status{color:#a6dcb5}pre{white-space:pre-wrap;background:#0d1711;padding:12px;border-radius:8px;max-height:180px;overflow:auto;color:#9cc6a6}[hidden]{display:none!important}@media(max-width:850px){.paths,.grid{grid-template-columns:1fr}.segment{grid-template-columns:1fr 1fr}.segment .source{grid-column:1/-1}}
</style></head><body><header><div style="display:flex;justify-content:space-between;align-items:center"><h1 data-i18n="title">自动话题剪辑</h1><label><span data-i18n="language">设置 · 语言</span> <select id="language" style="width:130px"><option value="zh">中文</option><option value="en">English</option></select></label></div><p data-i18n="subtitle">把有效片段按话题排好，导出竖屏 1080p · 60 帧成片</p></header><main>
<section class="card"><h2 data-i18n="step1">1. 选择目录</h2><div class="paths"><div class="field"><label data-i18n="source">素材目录</label><div class="pathrow"><input id="sources" placeholder="原视频所在文件夹" data-placeholder="sourcePlaceholder"><button data-choose="sources" data-i18n="choose">选择</button></div></div><div class="field"><label data-i18n="output">成品目录</label><div class="pathrow"><input id="output" placeholder="分类视频保存位置" data-placeholder="outputPlaceholder"><button data-choose="output" data-i18n="choose">选择</button></div></div></div></section>
<section class="card"><h2 data-i18n="step2">2. AI 理解素材</h2><div class="paths"><div class="field"><label data-i18n="transcriptionKey">OpenAI 转写密钥</label><input id="apikey" type="password" autocomplete="off" placeholder="sk-..."></div><div class="field"><label data-i18n="provider">内容规划服务</label><select id="provider"><option value="openai" data-i18n="openaiRecommended">OpenAI（推荐）</option><option value="deepseek" data-i18n="deepseek">DeepSeek</option><option value="gemini" data-i18n="gemini">Google Gemini</option><option value="compatible" data-i18n="compatible">自定义兼容接口</option></select></div><div class="field" id="openaiModelRow"><label data-i18n="model">内容分析模型</label><select id="model"><option value="gpt-5-mini">GPT-5 mini（推荐）</option><option value="gpt-4o-mini">GPT-4o mini</option><option value="gpt-4.1-mini">GPT-4.1 mini</option><option value="gpt-4.1">GPT-4.1</option></select></div><div class="field" id="customModelRow" hidden><label data-i18n="customModel">兼容接口模型名</label><input id="customModel" placeholder="model-id"></div><div class="field" id="customUrlRow" hidden><label data-i18n="customUrl">兼容接口基础地址（以 /v1 结尾）</label><input id="customUrl" placeholder="https://example.com/v1"></div><div class="field" id="customKeyRow" hidden><label data-i18n="customKey">兼容接口密钥</label><input id="customKey" type="password" autocomplete="off"></div></div><p class="hint" data-i18n="aiHint">先用 OpenAI 转写原声，再由所选模型拆解话题、钩子和切点；其它服务仅负责内容规划。API 调用会产生费用。</p><button id="analyze" data-i18n="analyze">分析素材并生成计划</button></section>
<section class="card"><h2 data-i18n="step3">3. 检查分类并选模板</h2><div id="topics"></div><p class="hint" data-i18n="reviewHint">每条内容按话题单独保存。第一段是开头钩子；可调整模板、片段顺序和转折动效。</p></section>
<section class="card"><h2 data-i18n="step4">4. 导出</h2><div class="footer"><button id="render" data-i18n="render">开始剪辑</button><span id="status" data-i18n="ready">准备就绪</span></div><pre id="log" hidden></pre></section></main><script src="renderer.js"></script></body></html>
