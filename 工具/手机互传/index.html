<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#18251f"><title>手机视频互传</title>
<style>
:root{color-scheme:dark;--bg:#111814;--panel:#1b251f;--line:#344139;--text:#eff4ed;--muted:#aab7ac;--green:#a9d6a4;--accent:#365744}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:850px;margin:auto;padding:24px 18px 48px}h1{font-size:27px;margin:0 0 8px}h2{font-size:20px}p{color:var(--muted);line-height:1.55;margin:4px 0 14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input,button{font:inherit;border-radius:10px;border:1px solid var(--line);padding:11px 13px;background:#121a15;color:var(--text)}input[type=password]{width:160px}button{background:var(--accent);border:0;font-weight:650;cursor:pointer}.ghost{background:#29352d}.drop{border:1px dashed #728576;border-radius:13px;padding:22px;text-align:center;margin-top:12px}.drop input{max-width:100%;background:transparent;border:0}.status{min-height:24px;color:var(--green);font-size:14px}.video{width:100%;max-height:55vh;background:#000;border-radius:12px;margin-top:12px}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:12px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:5px 12px}.name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted)}.item button{grid-column:2;grid-row:1/3;align-self:center}.empty{padding:25px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:520px){main{padding:16px 12px 32px}.panel{padding:14px}.item{grid-template-columns:1fr}.item button{grid-column:1;grid-row:auto;justify-self:start}}
</style></head><body><main><header><h1>手机视频互传</h1><p>手机和电脑连同一个 Wi-Fi，上传手机视频，也可播放、下载电脑里的成片。</p></header>
<section class="panel"><div class="row"><label for="code">电脑访问码</label><input id="code" type="password" inputmode="text" placeholder="输入电脑上显示的访问码"><button id="connect">连接电脑</button></div><div id="connectStatus" class="status"></div></section>
<div id="app" hidden><section class="panel"><h2>传到电脑</h2><p>上传会保存到项目的“素材/手机传入”。同名文件自动改名保留。</p><div class="drop"><input id="files" type="file" accept="video/*,.mov,.m4v,.mkv" multiple><div id="uploadStatus" class="status">选择一个或多个视频开始上传。</div></div></section>
<section class="panel"><div class="row" style="justify-content:space-between"><div><h2>电脑视频</h2><p>成品目录和手机传入目录</p></div><button id="refresh" class="ghost">刷新</button></div><div id="list" class="list"></div><video id="player" class="video" controls playsinline hidden></video></section></div></main>
<script>
const $=id=>document.getElementById(id),code=$('code');code.value=sessionStorage.getItem('share-code')||'';
function url(p){return p+(p.includes('?')?'&':'?')+'code='+encodeURIComponent(code.value.trim())}
async function connect(){code.value=code.value.trim();sessionStorage.setItem('share-code',code.value);try{const r=await fetch(url('/api/videos'));if(!r.ok)throw Error('访问码错误，或电脑没有响应。');$('app').hidden=false;$('connectStatus').textContent='已连接';refresh()}catch(e){$('connectStatus').textContent=e.message;$('app').hidden=true}}
async function refresh(){try{const r=await fetch(url('/api/videos'));if(!r.ok)throw Error('无法读取视频列表');const list=$('list');list.replaceChildren();for(const x of await r.json()){const row=document.createElement('div');row.className='item';const n=document.createElement('div');n.className='name';n.textContent=x.name;const m=document.createElement('div');m.className='meta';m.textContent=x.folder+' · '+(x.size/1048576).toFixed(1)+' MB';const b=document.createElement('button');b.textContent='播放';b.onclick=()=>{$('player').src=url('/video/'+x.id);$('player').hidden=false;$('player').scrollIntoView({behavior:'smooth'});$('player').play().catch(()=>{})};const a=document.createElement('a');a.href=url('/video/'+x.id);a.download=x.name;a.textContent='下载';a.style='color:#a9d6a4;padding:8px';row.append(n,m,b,a);list.append(row)}if(!list.children.length)list.innerHTML='<div class="empty">暂无视频，可先上传。</div>'}catch(e){$('list').textContent=e.message}}
$('connect').onclick=connect;$('refresh').onclick=refresh;code.addEventListener('keydown',e=>{if(e.key==='Enter')connect()});if(code.value)connect();
$('files').onchange=async e=>{const files=Array.from(e.target.files);for(let i=0;i<files.length;i++){const f=files[i];$('uploadStatus').textContent='正在上传 '+(i+1)+'/'+files.length+' '+f.name;await new Promise(resolve=>{const x=new XMLHttpRequest();x.open('PUT',url('/api/upload?name='+encodeURIComponent(f.name)));x.setRequestHeader('Content-Type','application/octet-stream');x.upload.onprogress=v=>{if(v.lengthComputable)$('uploadStatus').textContent=f.name+' '+Math.round(v.loaded/v.total*100)+'%'};x.onload=()=>{$('uploadStatus').textContent=x.status<300?'已传到电脑：'+JSON.parse(x.responseText).name:'上传失败：'+x.responseText;resolve()};x.onerror=()=>{$('uploadStatus').textContent='连接中断，请检查 Wi-Fi。';resolve()};x.send(f)})}e.target.value='';refresh()};
</script></body></html>
